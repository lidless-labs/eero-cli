[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eero-cli"
version = "0.1.0"
description = "Tiny CLI for managing eero mesh devices (auth, list, forget, bulk cleanup)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Solomon Neas", email = "me@solomonneas.dev" }]
keywords = ["eero", "mesh", "wifi", "cli", "network"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "eero-api>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/solomonneas/eero-cli"
Issues = "https://github.com/solomonneas/eero-cli/issues"

[project.scripts]
eero = "eero_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
